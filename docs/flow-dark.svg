<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img" font-family="'Noto Sans CJK TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif">
<title>但聞人語的聽寫流程：地端與雲端</title>
<desc>錄音、Silero VAD 語音偵測、語音辨識（本機 SenseVoice 或雲端 whisper-large-v3-turbo）、OpenCC 與替換字典、整理模式的 LLM（本機 Ollama 或雲端 Groq、Cloudflare），最後貼上。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9C9A92" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="190" y="12" width="14" height="14" rx="3" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="212" y="19" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">地端（這台電腦）</text>
<rect x="370" y="12" width="14" height="14" rx="3" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/>
<text x="392" y="19" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">雲端（要連網）</text>
<rect x="40" y="404" width="600" height="106" rx="12" fill="none" stroke="#5F5E5A" stroke-width="0.75" stroke-dasharray="5 4"/>
<path d="M340 106 L340 134" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 192 L340 212 L190 212 L190 234" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 212 L490 212 L490 234" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M190 292 L190 314 L340 314 L340 334" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M490 292 L490 314 L340 314" fill="none" stroke="#9C9A92" stroke-width="1.5"/>
<path d="M480 364 L655 364 L655 568 L484 568" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4 4"/>
<path d="M340 392 L340 402" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 510 L340 538" fill="none" stroke="#9C9A92" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="500" y="350" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">一般聽寫直接貼上</text>
<text x="56" y="421" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="central">整理模式才做（短按再按住）：小紙條＋LLM</text>
<rect x="220" y="50" width="240" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="340" y="68" fill="#D3D1C7" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">按住右 Ctrl 說話</text>
<text x="340" y="88" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">錄音（藍牙自動切免持）</text>
<rect x="220" y="136" width="240" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="340" y="154" fill="#9FE1CB" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">語音偵測 Silero VAD</text>
<text x="340" y="174" fill="#5DCAA5" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">沒說話就不送辨識</text>
