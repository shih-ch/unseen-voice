<text x="190" y="254" fill="#9FE1CB" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">SenseVoice Small</text>
<text x="190" y="274" fill="#5DCAA5" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">方案 A、B・sherpa-onnx CPU</text>
