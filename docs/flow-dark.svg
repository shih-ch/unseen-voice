<text x="490" y="254" fill="#F5C4B3" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">whisper-large-v3-turbo</text>
<text x="490" y="274" fill="#F0997B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">方案 C Groq・D Cloudflare</text>
