<text x="340" y="374" fill="#5DCAA5" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">OpenCC s2twp・一律本機</text>
<rect x="60" y="438" width="170" height="56" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.75"/>
<text x="145" y="456" fill="#9FE1CB" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Ollama qwen3:4b</text>
<text x="145" y="476" fill="#5DCAA5" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">方案 A</text>
<rect x="255" y="438" width="170" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/>
<text x="340" y="456" fill="#F5C4B3" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">Groq qwen3.8-27b</text>
<text x="340" y="476" fill="#F0997B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">方案 B（預設）、C</text>
<rect x="450" y="438" width="170" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.75"/>
<text x="535" y="456" fill="#F5C4B3" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">llama-3.3-70b</text>
<text x="535" y="476" fill="#F0997B" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">方案 D Cloudflare</text>
<rect x="200" y="540" width="280" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.75"/>
<text x="340" y="558" fill="#D3D1C7" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">貼到目前的程式</text>
<text x="340" y="578" fill="#B4B2A9" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="central">剪貼簿＋模擬 Ctrl+V</text>
