# 但聞人語（danwen）設定檔
# 這裡列出的都是預設值；只需保留要改的項目，其餘可刪除。
# 修改後執行：systemctl --user restart danwen

hotkey:
  # evdev 按鍵名稱，可用 `danwen devices` 查看鍵盤；不要選 fcitx5 會用到的鍵
  key: KEY_RIGHTCTRL
  # 按住超過這個時間（毫秒）才開始錄音；短按不會觸發
  hold_ms: 300
  # 整理模式：先短按一下熱鍵，在這個時間（毫秒）內再按住說話；0＝停用整理模式
  double_tap_ms: 400

audio:
  # 麥克風：null＝系統預設；也可填裝置名稱的一部分或編號（`danwen devices` 列出）
  device: null
  sample_rate: 16000
  # 短於這個長度的錄音直接丟棄（秒）
  min_duration_s: 0.4
  # 錄音上限（秒），避免鍵盤斷線時一直錄下去
  max_duration_s: 120.0
  # 音量低於這個值（dBFS）視為沒講話，不送辨識，避免 Whisper 幻覺
  silence_dbfs: -50.0

long_recording:
  # 很快連按兩下熱鍵開始長錄音（不必按著），再按一下結束、Esc 取消；需要 hotkey.double_tap_ms 大於 0
  enabled: true
  # 長錄音上限（秒）
  max_duration_s: 600.0
  # 短於這個長度的長錄音視為誤觸（例如連按想停止時又開始一段），丟棄不貼上
  min_duration_s: 1.5
  # 長錄音結束後是否交給整理模式（較長的內容整理會比較久）
  refine: false

asr:
  # sensevoice（A，預設，CPU）或 whisper_server（B，需 install.sh --with-whisper）
  backend: sensevoice
  sensevoice:
    num_threads: 4
    # 自動加標點、數字正規化
    use_itn: true
  whisper_server:
    url: http://127.0.0.1:8178
    language: zh
    # 引導 Whisper 輸出繁體；也可加入常用專有名詞
    prompt: 以下是繁體中文的句子。
    timeout_s: 30.0
    # server 沒在跑時自動啟動 danwen-whisper.service
    autostart: true

postprocess:
  # OpenCC 轉換設定：s2twp（台灣用字＋用語）、s2tw（只轉字）；空字串＝不轉換
  opencc: s2twp
  # 替換字典路徑；null＝~/.config/danwen/replacements.yaml（不存在時用內建預設）
  replacements: null

refine:
  # 整理模式用的 LLM。ollama＝本機 Ollama（離線）；openai＝任何 OpenAI 相容服務（Groq、OpenAI 等，需連網）
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen3:4b-instruct-2507-q4_K_M
  # provider: openai 時，存放 API Key 的檔案（請 chmod 600），例如 ~/.config/danwen/api_key
  api_key_file: null
  timeout_s: 30.0
  # ollama：用過後模型留在記憶體多久（約佔 3 GB）；開始錄音時會先載入
  keep_alive: 30m
  # 預設的小紙條（~/.config/danwen/prompts/ 裡的檔名）；可用 `danwen mode` 隨時切換
  mode: 日常
  # 方案要用雲端整理、但雲端不能用（沒有金鑰、斷網、超過用量）時：
  #   false＝貼上原文，不喚醒本機 Ollama（省下約 3 GB 記憶體與載入等待）
  #   true＝改用本機 Ollama 整理
  local_fallback: false
  # 上下文：把剪貼簿／最近選取的文字當參考資料交給 LLM（只用來判斷專有名詞與上下文，不會照抄或執行）
  context_clipboard: false
  context_selection: false
  # 每個來源最多取幾個字
  context_max_chars: 1000
  # base_url 不是本機時，預設不送出上下文；要送到雲端服務請明確改成 true
  context_to_cloud: false

cloud:
  # 方案：哪些部分走雲端（走雲端的錄音或文字會送出電腦）
  #   local       A 全部本機
  #   hybrid      B 本機辨識＋Groq 整理（預設；只有整理模式的文字會送出，沒有金鑰時整理改用本機）
  #   groq        C 全部用 Groq
  #   cloudflare  D 全部用 Cloudflare（需填 account_id）
  #   custom      E 依下面的 provider、use_for_asr、use_for_refine
  # 執行中可用 `danwen cloud <方案>` 或 GNOME extension 選單切換，這裡是預設值
  plan: hybrid
  # 以下給 custom 方案使用（account_id 也給 D 使用）：
  # groq、openai、cloudflare，或 custom（任何 OpenAI 相容服務，需填 base_url）
  provider: groq
  # Cloudflare 的 Account ID（provider: cloudflare 時必填）
  account_id: null
  # custom 時填 OpenAI 相容網址，例如 https://openrouter.ai/api/v1；其他服務商留空即可
  base_url: null
  # null＝用服務商的預設模型（`danwen cloud` 可查看）
  asr_model: null
  llm_model: null
  # 引導雲端 Whisper 輸出繁體；字典裡的專有名詞會自動附加
  asr_prompt: 以下是繁體中文的句子。
  # 雲端辨識的語言：null＝自動判斷（實測中文、英文、中英夾雜都正確）；
  # 固定 zh 時整句英文會被硬翻成中文，不建議
  asr_language: null
  # custom 方案時，哪些部分走雲端
  use_for_asr: true
  use_for_refine: true
  timeout_s: 30.0
  # API Key 存在 GNOME 鑰匙圈，不寫在這裡：`danwen key set`

output:
  # 貼上後還原原本的剪貼簿
  restore_clipboard: true
  restore_delay_ms: 500

feedback:
  # 開始／結束錄音的提示音
  sounds: true
  # 發生錯誤時跳出桌面通知
  notify_errors: true

history:
  # 保留最近幾次聽寫的文字（只有你自己能讀）；0＝不保留。用 `danwen history` 查看、重新整理
  size: 20
  # 是否一併保留錄音（預設否）；開啟後可用 `danwen history play` 重聽
  keep_audio: false

log:
  # 是否把辨識出的文字寫進 log（預設否）
  log_text: false
